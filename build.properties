javacc.dir=/usr/share/java

src.dir=.
build.dir=build
build.classes.dir=build/classes
build.jar=lib/cbc.jar

# ASM, used by the JVM (-arch=jvm) code generator.  Both properties must
# point at the same file; the basename is duplicated because ant has no
# built-in way to extract it from a path in a manifest attribute.
asm.jar=lib/asm-9.7.1.jar
asm.jar.basename=asm-9.7.1.jar

src.jj.file=./net/loveruby/cflat/parser/Parser.jj
build.parser.dir=./net/loveruby/cflat/parser
